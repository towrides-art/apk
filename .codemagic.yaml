workflows:
  ios-workflow:
    name: iOS Release Build
    max_build_duration: 120
    environment:
      xcode: 15.0
      cocoapods: default
      node: latest
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      
      - name: Build iOS
        script: |
          xcodebuild -workspace TowRides.xcworkspace \
            -scheme TowRides \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/TowRides.xcarchive \
            archive
      
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/TowRides.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist exportOptions.plist
    
    artifacts:
      - build/*.ipa
    
    publishing:
      email:
        recipients:
          - your-email@example.com
