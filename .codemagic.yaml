workflows:
  ios-workflow-v2:
    name: iOS Release Build (Xcode 15.4)
    max_build_duration: 120
    environment:
      xcode: 15.4
      cocoapods: default
      node: latest
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Use Xcode 15.4
        script: |
          sudo xcode-select --switch /Applications/Xcode-15.4.app
          xcodebuild -version
      
      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock ~/Library/Developer/Xcode/DerivedData
          pod install --repo-update
      
      - name: Build iOS
        script: |
          xcodebuild -workspace TowRides.xcworkspace \
            -scheme TowRides \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/TowRides.xcarchive \
            archive
      
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/TowRides.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist exportOptions.plist
    
    artifacts:
      - build/*.ipa
    
    publishing:
      email:
        recipients:
          - your-email@example.com
