workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      xcode: 16.0
      cocoapods: default
      node: 18.20.4
      vars:
        XCODE_PATH: /Applications/Xcode-16.0.app
        DEVELOPER_DIR: /Applications/Xcode-16.0.app/Contents/Developer
        RCT_NEW_ARCH_ENABLED: "0"
        RCT_FABRIC_ENABLED: "0"
        USE_HERMES: "0"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.towrides.app
    scripts:
      - name: Remove junk files
        script: |
          rm -rf __MACOSX
      - name: Install dependencies
        script: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install --legacy-peer-deps
          echo "=== REMOVING FIREBASE PACKAGES IMMEDIATELY ==="
          rm -rf node_modules/@react-native-firebase 2>/dev/null || true
          rm -rf node_modules/firebase 2>/dev/null || true
          ls -la node_modules/@react-native-firebase 2>/dev/null || echo "No Firebase packages found"
          npx patch-package || echo "No patches to apply"
          echo "=== PATCHING COMPLETE ==="
      - name: Use Xcode 16.0
        script: |
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode not found at $XCODE_PATH" && ls /Applications && exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH"
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version
      - name: Clean and Install Pods
        script: |
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          echo "=== VERIFYING FIREBASE REMOVAL BEFORE POD INSTALL ==="
          rm -rf node_modules/@react-native-firebase 2>/dev/null || true
          rm -rf node_modules/firebase 2>/dev/null || true
          ls -la node_modules/@react-native-firebase 2>/dev/null || echo "No Firebase in node_modules"
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/CocoaPods
          rm -rf ios/build
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          cd ios
          pod deintegrate
          pod cache clean --all
          pod repo update
          pod install --repo-update
          echo "=== CHECKING FOR FIREBASE PODS ==="
          cat Podfile.lock | grep -i firebase || echo "No Firebase pods found in Podfile.lock"
          echo "=== REMOVING ANY FIREBASE PODS IF PRESENT ==="
          rm -rf Pods/Firebase* 2>/dev/null || true
          rm -rf Pods/RNFB* 2>/dev/null || true
          rm -rf Pods/Headers/Public/Firebase* 2>/dev/null || true
          ls -la Pods | grep -i firebase || echo "No Firebase pods in Pods directory"
          echo "=== POD INSTALL COMPLETE ==="
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          export RCT_NEW_ARCH_ENABLED=0
          export RCT_FABRIC_ENABLED=0
          export USE_HERMES=0
          export RCT_SKIP_CODEGEN=1
          export OTHER_CFLAGS="-w"
          export WARNING_CFLAGS="-w"
          NODE_BINARY="$(command -v node)"
          if [ -z "$NODE_BINARY" ]; then
            echo "Node not found in PATH" && exit 1
          fi
          export NODE_BINARY
          export PATH="$(dirname "$NODE_BINARY"):$PATH"
          cd ios
          cat <<EOF > .xcode.env
          RCT_NEW_ARCH_ENABLED=0
          RCT_FABRIC_ENABLED=0
          RCT_SKIP_CODEGEN=1
          NODE_BINARY=$NODE_BINARY
          PATH=$PATH
          EOF
          cat <<EOF > .xcode.env.local
          RCT_NEW_ARCH_ENABLED=0
          RCT_FABRIC_ENABLED=0
          RCT_SKIP_CODEGEN=1
          NODE_BINARY=$NODE_BINARY
          PATH=$PATH
          EOF
          mkdir -p /tmp/xcodebuild_logs
          set -o pipefail
          xcodebuild \
            -workspace TowRides.xcworkspace \
            -scheme TowRides \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath /tmp/build/TowRides.xcarchive \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS="-w" \
            WARNING_CFLAGS="-w" \
            archive \
            | tee /tmp/xcodebuild_logs/archive.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "BUILD FAILED - See logs above"
            exit 1
          fi
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/build/TowRides.xcarchive \
            -exportPath /tmp/build \
            -exportOptionsPlist ExportOptions.plist \
            | tee /tmp/xcodebuild_logs/export.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "EXPORT FAILED - See logs above"
            exit 1
          fi
          echo "=== BUILD SUCCESSFUL ==="
    artifacts:
      - /tmp/build/*.ipa
