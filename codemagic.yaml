workflows:
  ios-workflow:
    name: iOS Build

    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    environment:
      xcode: 16.0
      cocoapods: default
      node: 18.20.4

      vars:
        XCODE_PATH: /Applications/Xcode-16.0.app
        DEVELOPER_DIR: /Applications/Xcode-16.0.app/Contents/Developer
        RCT_NEW_ARCH_ENABLED: "0"
        RCT_FABRIC_ENABLED: "0"
        USE_HERMES: "0"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.towrides.app

    scripts:
      - name: Setup environment
        script: |
          rm -rf __MACOSX
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode not found at $XCODE_PATH" && ls /Applications && exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version
          echo "Git commit: $(git rev-parse HEAD)"

      - name: Install npm dependencies
        script: |
          rm -rf node_modules
          npm install --legacy-peer-deps
          npx patch-package

          echo "=== DELETING FIREBASE FROM NODE_MODULES ==="
          rm -rf node_modules/@react-native-firebase
          rm -rf node_modules/@notifee
          rm -rf node_modules/firebase
          rm -rf node_modules/@firebase
          if [ -d "node_modules/@react-native-firebase" ]; then
            echo "FAIL: @react-native-firebase still in node_modules"
            exit 1
          fi
          echo "OK: node_modules clean of Firebase"

      - name: Install pods
        script: |
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/CocoaPods

          cd ios
          rm -rf Pods Podfile.lock build generated

          pod deintegrate || true
          pod cache clean --all
          pod install --repo-update

          echo "=== VERIFY PODS ==="
          if grep -ri 'RNFBApp\|RNFBMessaging\|RNFBAuth' Pods/Pods.xcodeproj/project.pbxproj 2>/dev/null; then
            echo "WARNING: RNFB found in Pods.xcodeproj - Podfile post_install should have removed it"
          fi
          echo "Pod install done"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          export RCT_NEW_ARCH_ENABLED=0
          export RCT_FABRIC_ENABLED=0
          export USE_HERMES=0
          export RCT_SKIP_CODEGEN=1
          NODE_BINARY="$(command -v node)"
          if [ -z "$NODE_BINARY" ]; then
            echo "Node not found in PATH" && exit 1
          fi
          export NODE_BINARY
          export PATH="$(dirname "$NODE_BINARY"):$PATH"

          cd ios

          cat <<'EOF' > .xcode.env
          export RCT_NEW_ARCH_ENABLED=0
          export RCT_FABRIC_ENABLED=0
          export RCT_SKIP_CODEGEN=1
          EOF

          echo "export NODE_BINARY=$NODE_BINARY" >> .xcode.env
          echo "export PATH=$PATH" >> .xcode.env
          cp .xcode.env .xcode.env.local

          echo "=== FINAL RNFB CHECK BEFORE BUILD ==="
          if grep -ri 'RNFBApp\|RNFBMessaging\|RNFBAuth' Pods/Pods.xcodeproj/project.pbxproj 2>/dev/null; then
            echo "RNFB STILL in Pods xcodeproj - running emergency removal"
            ruby <<'RUBY'
require 'xcodeproj'
pods_proj = Xcodeproj::Project.open('Pods/Pods.xcodeproj')
pods_proj.targets.each do |t|
  if t.name =~ /RNFB|Firebase|GoogleUtilities|GoogleDataTransport|GTMSessionFetcher|FBLPromises|PromisesObjC|nanopb|RecaptchaInterop|Notifee/i
    puts "Removing: #{t.name}"
    t.remove_from_project
  end
end
pods_proj.save

app_proj = Xcodeproj::Project.open('../TowRides.xcodeproj')
app_proj.targets.each do |t|
  t.build_phases.each do |bp|
    if bp.respond_to?(:name) && bp.name.to_s.include?('RNFB')
      puts "Removing build phase: #{bp.name}"
      bp.remove_from_project
    end
  end
end
app_proj.save
RUBY
            rm -rf Pods/RNFBApp Pods/RNFBAuth Pods/RNFBMessaging
            rm -rf "Pods/Target Support Files/RNFBApp" "Pods/Target Support Files/RNFBAuth" "Pods/Target Support Files/RNFBMessaging"
            rm -rf Pods/Firebase* Pods/GoogleUtilities Pods/GoogleDataTransport
            rm -rf "Pods/Target Support Files/Firebase*" "Pods/Target Support Files/GoogleUtilities"
            rm -rf Pods/Headers/Public/RNFB* Pods/Headers/Public/Firebase* Pods/Headers/Private/RNFB*
            echo "Emergency removal done"
          else
            echo "OK: Zero RNFB in Pods"
          fi

          cd ..
          mkdir -p /tmp/xcodebuild_logs
          set -o pipefail

          "$DEVELOPER_DIR/usr/bin/xcodebuild" \
            -workspace ios/TowRides.xcworkspace \
            -scheme TowRides \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild_logs/xcodebuild.log

          status=$?
          if [ $status -ne 0 ]; then
            echo "--- xcodebuild error lines ---"
            grep -n "error:" /tmp/xcodebuild_logs/xcodebuild.log | tail -n 200 || true
            echo "--- xcodebuild last 200 lines ---"
            tail -n 200 /tmp/xcodebuild_logs/xcodebuild.log
            exit $status
          fi

    artifacts:
      - ios/build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
