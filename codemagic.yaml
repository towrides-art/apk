workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      xcode: 16.0
      cocoapods: default
      node: 18.20.4
      vars:
        XCODE_PATH: /Applications/Xcode-16.0.app
        DEVELOPER_DIR: /Applications/Xcode-16.0.app/Contents/Developer
        RCT_NEW_ARCH_ENABLED: "0"
        RCT_FABRIC_ENABLED: "0"
        USE_HERMES: "0"
        RCT_SKIP_CODEGEN: "1"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.towrides.app

    # Disable caching to prevent stale node_modules with Firebase
    cache:
      cache_paths: []

    scripts:
      - name: Remove junk & old artifacts
        script: |
          set -e
          rm -rf __MACOSX
          rm -rf node_modules
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/build
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/CocoaPods
          echo "Old artifacts cleaned"

      - name: Install Node dependencies
        script: |
          set -e
          rm -f package-lock.json yarn.lock
          npm cache clean --force
          npm install --legacy-peer-deps --no-audit --no-fund

          echo "=== NUCLEAR FIREBASE REMOVAL ==="
          rm -rf node_modules/@react-native-firebase
          rm -rf node_modules/firebase
          rm -rf node_modules/@firebase
          if [ -d "node_modules/@react-native-firebase" ]; then
            sudo rm -rf node_modules/@react-native-firebase || true
          fi
          if [ -d "node_modules/@react-native-firebase" ]; then
            echo "FATAL: Cannot delete Firebase!"
            exit 1
          fi
          echo "Firebase confirmed deleted from node_modules"

          # Apply local patches
          npx patch-package || echo "No patches to apply"

      - name: Configure Xcode 16.0
        script: |
          set -e
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode not found at $XCODE_PATH"
            ls /Applications
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH"
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Install Pods
        script: |
          set -e
          export DEVELOPER_DIR="$DEVELOPER_DIR"

          # Final Firebase check before pod install
          rm -rf node_modules/@react-native-firebase
          rm -rf node_modules/firebase
          rm -rf node_modules/@firebase
          if [ -d "node_modules/@react-native-firebase" ]; then
            sudo rm -rf node_modules/@react-native-firebase || true
          fi

          cd ios
          pod cache clean --all
          pod install --repo-update

          # Verify clean Podfile.lock
          if grep -qi "firebase\|RNFB" Podfile.lock; then
            echo "ERROR: Firebase pods still in Podfile.lock!"
            grep -i "firebase\|RNFB" Podfile.lock
            exit 1
          fi
          echo "Podfile.lock is Firebase-free"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          export RCT_NEW_ARCH_ENABLED=0
          export RCT_FABRIC_ENABLED=0
          export USE_HERMES=0
          export RCT_SKIP_CODEGEN=1

          NODE_BINARY="$(command -v node)"
          if [ -z "$NODE_BINARY" ]; then
            echo "Node not found in PATH" && exit 1
          fi
          export NODE_BINARY
          export PATH="$(dirname "$NODE_BINARY"):$PATH"

          cd ios

          cat > .xcode.env <<EOF
          RCT_NEW_ARCH_ENABLED=0
          RCT_FABRIC_ENABLED=0
          RCT_SKIP_CODEGEN=1
          NODE_BINARY=$NODE_BINARY
          PATH=$PATH
          EOF

          cat > .xcode.env.local <<EOF
          RCT_NEW_ARCH_ENABLED=0
          RCT_FABRIC_ENABLED=0
          RCT_SKIP_CODEGEN=1
          NODE_BINARY=$NODE_BINARY
          PATH=$PATH
          EOF

          mkdir -p /tmp/xcodebuild_logs
          set -o pipefail

          "$DEVELOPER_DIR/usr/bin/xcodebuild" \
            -workspace ios/TowRides.xcworkspace \
            -scheme TowRides \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee /tmp/xcodebuild_logs/xcodebuild.log

          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "--- xcodebuild error lines ---"
            grep -n "error:" /tmp/xcodebuild_logs/xcodebuild.log | tail -n 100 || true
            echo "--- last 200 lines ---"
            tail -n 200 /tmp/xcodebuild_logs/xcodebuild.log
            exit $status
          fi

    artifacts:
      - ios/build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
