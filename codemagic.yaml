workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 90
    environment:
      xcode: 16.0
      cocoapods: default
      node: 18.20.4
      vars:
        DEVELOPER_DIR: /Applications/Xcode-16.0.app/Contents/Developer
        RCT_NEW_ARCH_ENABLED: "0"
        RCT_FABRIC_ENABLED: "0"
        USE_HERMES: "0"
        RCT_SKIP_CODEGEN: "1"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.towrides.app

    cache:
      cache_paths: []

    scripts:
      - name: Clean everything
        script: |
          set -e
          rm -rf __MACOSX node_modules
          rm -rf ios/Pods ios/Podfile.lock ios/build
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/CocoaPods
          echo "Clean done"

      - name: Install Node dependencies
        script: |
          set -e
          rm -f package-lock.json yarn.lock
          npm cache clean --force

          # --ignore-scripts: postinstall nahi chalega during install
          npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

          echo "=== NUCLEAR FIREBASE + NOTIFEE REMOVAL ==="
          rm -rf node_modules/@react-native-firebase
          rm -rf node_modules/firebase
          rm -rf node_modules/@firebase
          rm -rf node_modules/@notifee

          # Verify deletion
          for pkg in "@react-native-firebase" "firebase" "@firebase" "@notifee"; do
            if [ -d "node_modules/$pkg" ]; then
              echo "FATAL: $pkg still exists after deletion!"
              exit 1
            fi
          done
          echo "CONFIRMED: All Firebase/Notifee packages deleted"

          # Now run patch-package manually (scripts were skipped above)
          npx patch-package || echo "No patches"

      - name: Configure Xcode
        script: |
          set -e
          sudo xcode-select --switch /Applications/Xcode-16.0.app
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Install Pods
        script: |
          set -e
          export DEVELOPER_DIR="$DEVELOPER_DIR"

          # Re-confirm Firebase gone before pod install
          rm -rf node_modules/@react-native-firebase node_modules/firebase node_modules/@firebase node_modules/@notifee
          echo "Pre-pod Firebase check:"
          ls node_modules | grep -i firebase || echo "  -> No firebase in node_modules"
          ls node_modules | grep -i notifee || echo "  -> No notifee in node_modules"

          cd ios
          pod cache clean --all
          pod install --repo-update 2>&1

          echo "=== Podfile.lock Firebase check ==="
          if grep -qi "RNFB\|FirebaseCore\|FirebaseAuth\|FirebaseMessaging\|GoogleDataTransport\|FirebaseInstallations" Podfile.lock; then
            echo "FATAL: Firebase pods found in Podfile.lock!"
            grep -i "RNFB\|Firebase\|GoogleData" Podfile.lock
            exit 1
          fi
          echo "CLEAN: No Firebase pods in Podfile.lock"
          echo "=== All installed pods ==="
          grep -E "^  - " Podfile.lock | head -60

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          export RCT_NEW_ARCH_ENABLED=0
          export RCT_FABRIC_ENABLED=0
          export USE_HERMES=0
          export RCT_SKIP_CODEGEN=1

          NODE_BINARY="$(command -v node)"
          export NODE_BINARY
          export PATH="$(dirname "$NODE_BINARY"):$PATH"

          # Write .xcode.env files (must be in ios/ directory)
          printf "export RCT_NEW_ARCH_ENABLED=0\nexport USE_HERMES=0\nexport NODE_BINARY=%s\nexport PATH=%s\n" \
            "$NODE_BINARY" "$PATH" > ios/.xcode.env
          cp ios/.xcode.env ios/.xcode.env.local

          mkdir -p /tmp/xcodebuild_logs

          # Nuke DerivedData to prevent stale build artifacts
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ios/build

          # NOTE: working dir is project root, NOT ios/
          # So -workspace path must include ios/
          set -o pipefail
          "$DEVELOPER_DIR/usr/bin/xcodebuild" \
            -workspace ios/TowRides.xcworkspace \
            -scheme TowRides \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            -archivePath ios/build/TowRides.xcarchive \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean archive \
            2>&1 | tee /tmp/xcodebuild_logs/xcodebuild.log

          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "--- ERRORS ---"
            grep " error:" /tmp/xcodebuild_logs/xcodebuild.log | tail -50 || true
            exit $status
          fi

      - name: Export IPA
        script: |
          set -e
          mkdir -p ios/build/export

          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          "$DEVELOPER_DIR/usr/bin/xcodebuild" \
            -exportArchive \
            -archivePath ios/build/TowRides.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath ios/build/export \
            2>&1

    artifacts:
      - ios/build/export/*.ipa
      - ios/build/TowRides.xcarchive
      - /tmp/xcodebuild_logs/*.log
