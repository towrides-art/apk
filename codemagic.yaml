workflows:
  ios-fresh-build:
    name: iOS Fresh Build v3
    max_build_duration: 60

    cache:
      cache_paths: []

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    environment:
      xcode: 16.0
      cocoapods: default
      node: 18.20.4
      vars:
        XCODE_PATH: /Applications/Xcode-16.0.app
        DEVELOPER_DIR: /Applications/Xcode-16.0.app/Contents/Developer
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.towrides.app

    scripts:
      - name: Setup Xcode
        script: |
          echo "========================================="
          echo "WORKFLOW: iOS Fresh Build v3"
          echo "GIT COMMIT: $(git rev-parse HEAD)"
          echo "PODFILE MD5: $(md5sum ios/Podfile | cut -d' ' -f1)"
          echo "========================================="
          rm -rf __MACOSX
          sudo xcode-select --switch "$XCODE_PATH"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Install npm and pods
        script: |
          set -e

          echo "=== NPM INSTALL ==="
          rm -rf node_modules
          npm install --legacy-peer-deps
          npx patch-package || true

          echo "=== NUKE FIREBASE FROM NODE_MODULES ==="
          rm -rf node_modules/@react-native-firebase node_modules/@notifee node_modules/firebase node_modules/@firebase
          find node_modules -name "react-native-firebase" -type d -exec rm -rf {} + 2>/dev/null || true
          if [ -d "node_modules/@react-native-firebase" ]; then
            echo "FATAL: Firebase still in node_modules" && exit 1
          fi
          echo "OK: node_modules clean"

          echo "=== POD INSTALL ==="
          cd ios
          rm -rf Pods Podfile.lock build generated
          rm -rf ~/Library/Developer/Xcode/DerivedData ~/Library/Caches/CocoaPods
          pod cache clean --all
          echo "--- Podfile monkey-patch should block Firebase pods ---"
          pod install --repo-update 2>&1 | tee /tmp/pod_install.log
          echo "--- Checking for PODFILE-BLOCK messages ---"
          grep "PODFILE-BLOCK" /tmp/pod_install.log || echo "No pods were blocked (good - they were not requested)"

          echo "=== POST-POD SAFETY: Remove any RNFB leftovers ==="
          rm -rf Pods/RNFBApp Pods/RNFBAuth Pods/RNFBMessaging
          rm -rf Pods/Firebase* Pods/GoogleUtilities Pods/GoogleDataTransport Pods/GTMSessionFetcher
          rm -rf Pods/FBLPromises Pods/PromisesObjC Pods/nanopb Pods/RecaptchaInterop
          find Pods/Target\ Support\ Files -maxdepth 1 -name "RNFB*" -exec rm -rf {} + 2>/dev/null || true
          find Pods/Target\ Support\ Files -maxdepth 1 -name "Firebase*" -exec rm -rf {} + 2>/dev/null || true
          find Pods/Target\ Support\ Files -maxdepth 1 -name "GoogleUtilities" -exec rm -rf {} + 2>/dev/null || true
          find Pods/Headers -name "RNFB*" -exec rm -rf {} + 2>/dev/null || true
          find Pods/Headers -name "Firebase*" -exec rm -rf {} + 2>/dev/null || true

          echo "=== SCRUB RNFB FROM XCODEPROJ FILES ==="
          ruby - <<'RUBY'
require 'xcodeproj'
proj = Xcodeproj::Project.open('Pods/Pods.xcodeproj')
removed = []
proj.targets.to_a.each do |t|
  if t.name =~ /RNFB|Firebase|GoogleUtilities|GoogleDataTransport|GTMSessionFetcher|FBLPromises|PromisesObjC|nanopb|RecaptchaInterop|Notifee/i
    removed << t.name
    t.remove_from_project
  end
end
proj.save
puts removed.empty? ? "No RNFB targets in Pods.xcodeproj (GOOD)" : "Removed #{removed.length}: #{removed.join(', ')}"

app = Xcodeproj::Project.open('../TowRides.xcodeproj')
app.targets.each do |t|
  t.build_phases.select { |bp| bp.respond_to?(:name) && bp.name.to_s =~ /RNFB|Firebase/i }.each do |bp|
    puts "Removing build phase: #{bp.name}"
    bp.remove_from_project
  end
end
app.save
RUBY

          echo "=== FINAL VERIFICATION ==="
          if grep -riq 'RNFBApp\|RNFBMessaging\|RNFBAuth' Pods/Pods.xcodeproj/project.pbxproj 2>/dev/null; then
            echo "FATAL: RNFB still in Pods.xcodeproj!"
            grep -ci 'RNFB' Pods/Pods.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "SUCCESS: ZERO RNFB - ready to build"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          NODE_BINARY="$(command -v node)"
          export NODE_BINARY
          export PATH="$(dirname "$NODE_BINARY"):$PATH"

          cd ios
          echo "export NODE_BINARY=$NODE_BINARY" > .xcode.env
          echo "export PATH=$PATH" >> .xcode.env
          cp .xcode.env .xcode.env.local

          cd ..
          mkdir -p /tmp/xcodebuild_logs
          set -o pipefail

          "$DEVELOPER_DIR/usr/bin/xcodebuild" \
            -workspace ios/TowRides.xcworkspace \
            -scheme TowRides \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild_logs/xcodebuild.log

          status=$?
          if [ $status -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            grep -n "error:" /tmp/xcodebuild_logs/xcodebuild.log | tail -50 || true
            exit $status
          fi

    artifacts:
      - ios/build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
