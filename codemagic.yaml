workflows:
  ios-fresh-build:
    name: iOS Fresh Build v2
    max_build_duration: 60

    cache:
      cache_paths: []

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    environment:
      xcode: 16.0
      cocoapods: default
      node: 18.20.4
      vars:
        XCODE_PATH: /Applications/Xcode-16.0.app
        DEVELOPER_DIR: /Applications/Xcode-16.0.app/Contents/Developer
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.towrides.app

    scripts:
      - name: Setup Xcode
        script: |
          echo "========================================="
          echo "GIT COMMIT: $(git rev-parse HEAD)"
          echo "========================================="
          rm -rf __MACOSX
          sudo xcode-select --switch "$XCODE_PATH"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Install and clean
        script: |
          echo "=== NPM INSTALL ==="
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npx patch-package || true

          echo "=== NUKE FIREBASE FROM NODE_MODULES ==="
          rm -rf node_modules/@react-native-firebase
          rm -rf node_modules/@notifee
          rm -rf node_modules/firebase
          rm -rf node_modules/@firebase
          find node_modules -name "react-native-firebase" -type d -exec rm -rf {} + 2>/dev/null || true
          find node_modules -name "firebase" -type d -exec rm -rf {} + 2>/dev/null || true

          echo "=== VERIFY NODE_MODULES ==="
          if find node_modules -path "*react-native-firebase*" -print -quit 2>/dev/null | grep -q .; then
            echo "FATAL: Firebase STILL in node_modules after deletion"
            find node_modules -path "*firebase*" -type d
            exit 1
          fi
          echo "OK: Zero Firebase in node_modules"

          echo "=== POD INSTALL ==="
          cd ios
          rm -rf Pods Podfile.lock build generated
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/CocoaPods
          pod cache clean --all
          pod install --repo-update 2>&1 | tail -50

          echo "=== NUKE RNFB FROM PODS ==="
          rm -rf Pods/RNFBApp Pods/RNFBAuth Pods/RNFBMessaging
          rm -rf Pods/Firebase Pods/FirebaseCore Pods/FirebaseAuth Pods/FirebaseMessaging
          rm -rf Pods/FirebaseCoreInternal Pods/FirebaseInstallations Pods/FirebaseCoreExtension
          rm -rf Pods/FirebaseAppCheckInterop Pods/FirebaseAuthInterop
          rm -rf Pods/GoogleUtilities Pods/GoogleDataTransport Pods/GTMSessionFetcher
          rm -rf Pods/FBLPromises Pods/PromisesObjC Pods/nanopb Pods/RecaptchaInterop
          rm -rf "Pods/Target Support Files/RNFBApp"
          rm -rf "Pods/Target Support Files/RNFBAuth"
          rm -rf "Pods/Target Support Files/RNFBMessaging"
          rm -rf "Pods/Target Support Files/Firebase"*
          rm -rf "Pods/Target Support Files/GoogleUtilities"
          rm -rf Pods/Headers/Public/RNFBApp Pods/Headers/Public/RNFBAuth Pods/Headers/Public/RNFBMessaging
          rm -rf Pods/Headers/Public/Firebase* Pods/Headers/Public/GoogleUtilities
          rm -rf Pods/Headers/Private/RNFBApp Pods/Headers/Private/RNFBAuth Pods/Headers/Private/RNFBMessaging
          rm -rf Pods/Headers/Private/Firebase*

          echo "=== REMOVE RNFB FROM PODS XCODEPROJ ==="
          ruby <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('Pods/Pods.xcodeproj')
          removed = []
          proj.targets.to_a.each do |t|
            if t.name =~ /RNFB|Firebase|GoogleUtilities|GoogleDataTransport|GTMSessionFetcher|FBLPromises|PromisesObjC|nanopb|RecaptchaInterop|Notifee/i
              removed << t.name
              t.remove_from_project
            end
          end
          proj.save
          puts "Removed #{removed.length} targets: #{removed.join(', ')}" unless removed.empty?
          puts "No RNFB targets found" if removed.empty?
          RUBY

          echo "=== REMOVE RNFB BUILD PHASE FROM APP ==="
          ruby <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('../TowRides.xcodeproj')
          proj.targets.each do |t|
            phases_to_remove = t.build_phases.select { |bp| bp.respond_to?(:name) && bp.name.to_s =~ /RNFB|Firebase/i }
            phases_to_remove.each do |bp|
              puts "Removing build phase: #{bp.name}"
              bp.remove_from_project
            end
          end
          proj.save
          RUBY

          echo "=== FINAL VERIFICATION ==="
          if grep -riq 'RNFBApp\|RNFBMessaging\|RNFBAuth' Pods/Pods.xcodeproj/project.pbxproj 2>/dev/null; then
            echo "FATAL: RNFB still in Pods.xcodeproj after removal!"
            grep -i 'RNFB' Pods/Pods.xcodeproj/project.pbxproj | head -5
            exit 1
          fi
          echo "SUCCESS: Zero RNFB in Pods - ready to build"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          NODE_BINARY="$(command -v node)"
          export NODE_BINARY
          export PATH="$(dirname "$NODE_BINARY"):$PATH"

          cd ios
          echo "export NODE_BINARY=$NODE_BINARY" > .xcode.env
          echo "export PATH=$PATH" >> .xcode.env
          cp .xcode.env .xcode.env.local

          cd ..
          mkdir -p /tmp/xcodebuild_logs
          set -o pipefail

          "$DEVELOPER_DIR/usr/bin/xcodebuild" \
            -workspace ios/TowRides.xcworkspace \
            -scheme TowRides \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            RCT_NEW_ARCH_ENABLED=0 \
            2>&1 | tee /tmp/xcodebuild_logs/xcodebuild.log

          status=$?
          if [ $status -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            grep -n "error:" /tmp/xcodebuild_logs/xcodebuild.log | tail -50 || true
            exit $status
          fi

    artifacts:
      - ios/build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
