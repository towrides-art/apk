workflows:
  ios-workflow:
    name: iOS Build

    max_build_duration: 60

    environment:
      xcode: 16.0
      cocoapods: default
      node: 18.20.4

      vars:
        XCODE_PATH: /Applications/Xcode-16.0.app
        DEVELOPER_DIR: /Applications/Xcode-16.0.app/Contents/Developer
        RCT_NEW_ARCH_ENABLED: "0"
        RCT_FABRIC_ENABLED: "0"
        USE_HERMES: "0"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.towrides.app

    scripts:
      - name: Remove junk files
        script: |
          rm -rf __MACOSX

      - name: Install dependencies
        script: |
          rm -rf node_modules
          npm install --legacy-peer-deps
          npx patch-package
          echo "--- Removing RNFB from node_modules ---"
          rm -rf node_modules/@react-native-firebase node_modules/@notifee node_modules/firebase node_modules/@firebase
          echo "--- Verify RNFB gone ---"
          ls node_modules/@react-native-firebase 2>/dev/null && echo "FAIL: RNFB still exists" && exit 1 || echo "OK: RNFB removed"

      - name: Use Xcode 16.0
        script: |
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode not found at $XCODE_PATH" && ls /Applications && exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH"
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Clean Pods
        script: |
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/CocoaPods
          rm -rf ios/build
          rm -rf ios/build/generated
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf node_modules

          npm install --legacy-peer-deps
          npx patch-package
          echo "--- Removing RNFB from node_modules ---"
          rm -rf node_modules/@react-native-firebase node_modules/@notifee node_modules/firebase node_modules/@firebase

          cd ios
          pod deintegrate
          pod cache clean --all
          pod repo update
          pod install --repo-update

          echo "--- Verify no RNFB pods ---"
          if grep -r 'RNFBApp\|RNFBMessaging\|RNFBAuth' Pods/Target\ Support\ Files/ 2>/dev/null; then
            echo "FAIL: RNFB pods found after pod install"
            exit 1
          else
            echo "OK: Zero RNFB pods"
          fi

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          export RCT_NEW_ARCH_ENABLED=0
          export RCT_FABRIC_ENABLED=0
          export USE_HERMES=0
          export RCT_SKIP_CODEGEN=1
          NODE_BINARY="$(command -v node)"
          if [ -z "$NODE_BINARY" ]; then
            echo "Node not found in PATH" && exit 1
          fi
          export NODE_BINARY
          export PATH="$(dirname "$NODE_BINARY"):$PATH"

          cd ios

          cat <<EOF > .xcode.env
          RCT_NEW_ARCH_ENABLED=0
          RCT_FABRIC_ENABLED=0
          RCT_SKIP_CODEGEN=1
          NODE_BINARY=$NODE_BINARY
          PATH=$PATH
          EOF

          cat <<EOF > .xcode.env.local
          RCT_NEW_ARCH_ENABLED=0
          RCT_FABRIC_ENABLED=0
          RCT_SKIP_CODEGEN=1
          NODE_BINARY=$NODE_BINARY
          PATH=$PATH
          EOF

          echo "--- Removing RNFB from node_modules (pre-pod) ---"
          rm -rf ../node_modules/@react-native-firebase ../node_modules/@notifee ../node_modules/firebase ../node_modules/@firebase

          pod deintegrate
          rm -rf Pods Podfile.lock build generated

          pod install --repo-update

          echo "=== NUCLEAR RNFB REMOVAL FROM PODS ==="

          rm -rf Pods/RNFBApp Pods/RNFBAuth Pods/RNFBMessaging
          rm -rf Pods/Firebase Pods/FirebaseCore Pods/FirebaseAuth Pods/FirebaseMessaging
          rm -rf Pods/FirebaseCoreInternal Pods/FirebaseInstallations Pods/FirebaseCoreExtension
          rm -rf Pods/FirebaseAppCheckInterop Pods/FirebaseAuthInterop
          rm -rf Pods/GoogleUtilities Pods/GoogleDataTransport
          rm -rf Pods/GTMSessionFetcher Pods/FBLPromises Pods/PromisesObjC
          rm -rf Pods/nanopb Pods/RecaptchaInterop
          rm -rf "Pods/Target Support Files/RNFBApp"
          rm -rf "Pods/Target Support Files/RNFBAuth"
          rm -rf "Pods/Target Support Files/RNFBMessaging"
          rm -rf "Pods/Target Support Files/Firebase"
          rm -rf "Pods/Target Support Files/FirebaseCore"
          rm -rf "Pods/Target Support Files/FirebaseAuth"
          rm -rf "Pods/Target Support Files/FirebaseMessaging"
          rm -rf "Pods/Target Support Files/FirebaseCoreInternal"
          rm -rf "Pods/Target Support Files/FirebaseInstallations"
          rm -rf "Pods/Target Support Files/FirebaseCoreExtension"
          rm -rf "Pods/Target Support Files/GoogleUtilities"
          rm -rf Pods/Headers/Public/RNFBApp Pods/Headers/Public/RNFBMessaging Pods/Headers/Public/RNFBAuth
          rm -rf Pods/Headers/Public/Firebase* Pods/Headers/Public/GoogleUtilities
          rm -rf Pods/Headers/Private/RNFBApp Pods/Headers/Private/RNFBMessaging Pods/Headers/Private/RNFBAuth

          echo "=== REMOVING RNFB FROM PODS XCODEPROJ ==="
          ruby <<'RUBY'
          require 'xcodeproj'

          pods_proj = Xcodeproj::Project.open('Pods/Pods.xcodeproj')
          removed = []
          pods_proj.targets.each do |t|
            if t.name =~ /RNFB|Firebase|GoogleUtilities|GoogleDataTransport|GTMSessionFetcher|FBLPromises|PromisesObjC|nanopb|RecaptchaInterop/
              removed << t.name
              t.remove_from_project
            end
          end
          pods_proj.save
          puts "Removed pod targets: #{removed.join(', ')}"

          app_proj = Xcodeproj::Project.open('../TowRides.xcodeproj')
          app_proj.targets.each do |t|
            t.build_phases.each do |bp|
              if bp.respond_to?(:name) && bp.name.to_s.include?('RNFB')
                puts "Removing build phase: #{bp.name}"
                bp.remove_from_project
              end
            end
          end
          app_proj.save
          puts "Done cleaning xcodeproj files"
          RUBY

          echo "=== FINAL VERIFY ==="
          if ls Pods/Target\ Support\ Files/RNFB* 2>/dev/null || ls Pods/Target\ Support\ Files/Firebase* 2>/dev/null; then
            echo "FAIL: RNFB/Firebase still in Pods"
            exit 1
          fi
          echo "OK: ZERO RNFB in Pods - safe to build"

          cd ..

          mkdir -p /tmp/xcodebuild_logs
          set -o pipefail

          "$DEVELOPER_DIR/usr/bin/xcodebuild" \
            -workspace ios/TowRides.xcworkspace \
            -scheme TowRides \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild_logs/xcodebuild.log

          status=$?
          if [ $status -ne 0 ]; then
            echo "--- xcodebuild error lines ---"
            grep -n "error:" /tmp/xcodebuild_logs/xcodebuild.log | tail -n 200 || true
            echo "--- xcodebuild last 200 lines ---"
            tail -n 200 /tmp/xcodebuild_logs/xcodebuild.log
            exit $status
          fi

    artifacts:
      - ios/build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
