workflows:
  ios-workflow:
    name: iOS Build

    max_build_duration: 60

    environment:
      xcode: 16.3
      cocoapods: default
      node: 18.20.4

      vars:
        RCT_NEW_ARCH_ENABLED: "0"
        RCT_FABRIC_ENABLED: "0"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.towrides.app

    scripts:
      - name: Remove junk files
        script: |
          rm -rf __MACOSX

      - name: Install dependencies
        script: |
          rm -rf node_modules
          npm install --legacy-peer-deps

      - name: Clean Pods
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ios/build
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

          cd ios
          pod deintegrate
          pod cache clean --all
          pod repo update
          pod install --repo-update

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          export RCT_NEW_ARCH_ENABLED=0
          export RCT_FABRIC_ENABLED=0

          xcode-project build-ipa \
            --workspace "ios/TowRides.xcworkspace" \
            --scheme "TowRides"

    artifacts:
      - build/ios/ipa/*.ipa
