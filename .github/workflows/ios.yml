name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Xcode 15.0
      run: |
        sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || echo "Using default Xcode"
        xcodebuild -version
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps
    
    - name: Install CocoaPods
      run: |
        cd ios
        pod update RCT-Folly --no-repo-update
        pod update fmt --no-repo-update
        pod install --repo-update
    
    - name: Build iOS
      run: |
        cd ios
        xcodebuild -workspace TowRides.xcworkspace \
          -scheme TowRides \
          -configuration Release \
          -sdk iphoneos \
          -archivePath build/TowRides.xcarchive \
          archive
    
    - name: Export IPA
      run: |
        cd ios
        xcodebuild -exportArchive \
          -archivePath build/TowRides.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist exportOptions.plist
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: TowRides-iOS
        path: ios/build/*.ipa
